name: Snapshot dát (ukončenie testu)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/snapshot.yml']
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stiahnuť dáta z proxy a uložiť do repozitára
        env:
          P: https://cgm-proxy.krajcovicroman.workers.dev
          FROM: 1793998800000
          END: 1795158900000
        run: |
          set -euo pipefail
          mkdir -p data
          g(){ curl -fsS --retry 3 -H "Origin: https://romcoloop.github.io" "$P/$1"; }
          for s in a b c; do
            g "$s/sgv?count=30000&from=$FROM" | jq -c --argjson e "$END" '[.[]|select(.date!=null and .date<=$e and .sgv>0)|{date,sgv}]|sort_by(.date)' > data/$s.json
          done
          g "b/mbg?count=200&from=$FROM" | jq -c '[.[]|{date,dateString,mbg}]' > data/mbg.json
          g "b/bg?count=200&from=$FROM" | jq -c '[.[]|{created_at,timestamp,glucose,units}]' > data/bg.json
          for f in data/*.json; do echo "$f $(jq length $f) záznamov, $(wc -c <$f) B"; done
          test "$(jq length data/a.json)" -gt 3000
          test "$(jq length data/b.json)" -gt 3000
          test "$(jq length data/c.json)" -gt 2000
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Snapshot dát k ukončeniu testu (20.11.2026 08:15 SEČ)"
          git push
